
name: Build Honor Resource Library LSPosed APK

on:
  workflow_dispatch:
  push:
    paths:
      - "HonorResourceLibLSPosed-16.0.20.221-experimental.zip"
      - ".github/workflows/build-honor-resource-lib.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Extract source ZIP
        run: |
          mkdir -p project
          unzip -q HonorResourceLibLSPosed-16.0.20.221-experimental.zip -d project
          find project -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print

      - name: Build debug APK
        run: |
          PROJECT_DIR="$(dirname "$(find project -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)")"
          if [ -z "$PROJECT_DIR" ] || [ "$PROJECT_DIR" = "." ]; then
            echo "Cannot find settings.gradle or settings.gradle.kts"
            exit 1
          fi
          echo "Building project at: $PROJECT_DIR"
          gradle -p "$PROJECT_DIR" assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HonorResourceLib-diagnostic-debug
          path: project/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
